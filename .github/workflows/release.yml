name: Classic Studio macOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Pin JUCE
        run: |
          cd libs/JUCE
          git fetch origin 7c89e11f6b7316c369f3d3f22227c60e816e738b
          git checkout 7c89e11f6b7316c369f3d3f22227c60e816e738b
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt
        run: "${{ env.QT_ROOT_DIR }}/bin/macdeployqt" build/OpenDaw_artefacts/Release/OpenDaw.app
      - name: Sign app ad hoc
        run: codesign --force --deep --sign - build/OpenDaw_artefacts/Release/OpenDaw.app
      - name: Package DMG
        run: hdiutil create -volname "Classic Studio" -srcfolder build/OpenDaw_artefacts/Release/OpenDaw.app -ov -format UDZO Classic-Studio-mac.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: classic-studio-macos
          path: Classic-Studio-mac.dmg
